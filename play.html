<script type="module">// Stories, observations and rules are original. Choices resolve locally in the browser.

const games = [
  {
    id: 'last-train', number: '01', title: '마지막 승객', subtitle: 'THE LAST PASSENGER', category: '규칙 생존', minutes: 3, fear: 2, location: '무명역 · 00:13', scene: 'train', accent: '#9c403d',
    summary: '막차에는 당신 말고도 누군가 타고 있다. 여섯 번째 역에서는 내리지 마세요.',
    intro: '야근을 마치고 올라탄 막차. 객차에는 아무도 없는데 맞은편 좌석이 천천히 꺼진다. 창문에 붙은 안내문 끝에는 누군가 손톱으로 쓴 문장이 있다. “이것만 지키면 집에 갈 수 있어.”',

    rounds: [
      choice('01: 이름을 부르는 방송', '스피커가 지직거린다. 안내 방송이 아주 정확하게 당신의 이름을 부른다. “분실물을 찾아가세요.”', [['answer','대답하고 분실물을 묻는다'],['quiet','입을 다문 채 기다린다'],['driver','운전실로 향한다']], 'quiet', '방송은 다른 이름을 부르기 시작했다. 다행히 당신의 이름은 잊은 것 같다.', '“확인되었습니다.” 방송이 답한다. 이제 모든 좌석에 당신의 이름이 적혀 있다.'),
      choice('02: 차창 속의 자리', '앞에는 아무도 없다. 검은 차창 속에서만 한 여자가 당신 옆에 앉아 있다. 그녀가 천천히 고개를 돌린다.', [['close','눈을 감는다'],['look','옆자리를 확인한다'],['wave','차창 속 여자에게 손을 흔든다']], 'close', '차가운 머리카락이 손등을 스치고 사라졌다. 눈을 뜨자 터널이 끝나 있다.', '옆자리에는 아무도 없다. 다시 차창을 보자 여자는 당신의 자리에 앉아 있다.'),
      choice('03: 여섯 번째 정차', '여섯 번째 역. 문이 열리고 익숙한 집 앞 골목이 보인다. 역명판에는 아무 글자도 없다.', [['exit','집이 보이니 내린다'],['stay','객차 안에서 기다린다'],['call','승강장에 대고 누군가를 부른다']], 'stay', '문 너머의 골목이 종이처럼 접혔다. 열차가 다시 움직인다.', '발을 내딛자 골목이 꺼진다. 돌아보니 열차 대신 긴 식탁이 놓여 있다.', [{label:'정차 횟수',value:'06'},{label:'역명판',value:'이름 없음'}]),
      choice('04: 젖지 않은 우산', '다음 터널에서 열차가 멈춘다. 빨간 우산을 든 사람이 닫힌 문을 통과한다. 당신의 좌석 번호를 보고 있다.', [['umbrella','우산을 받아 준다'],['sit','고개를 숙이고 앉아 있는다'],['stand','자리를 비우고 손잡이를 잡는다']], 'stand', '그는 당신이 앉았던 자리에 우산을 세웠다. 우산 끝에서 역 이름들이 쏟아진다.', '“예약된 자리입니다.” 무릎 아래부터 당신의 몸이 좌석 안으로 가라앉는다.'),
      choice('05: 귀가', '일곱 번째 역. 초록색 출구 표시가 켜진다. 뒤에서 익숙한 목소리가 “같이 가”라고 말한다.', [['leave','뒤를 보지 않고 초록색 출구로 나간다'],['wait','목소리의 주인을 기다린다'],['ride','한 정거장 더 간다']], 'leave', '계단 끝에 아침 냄새가 난다. 교통카드 내역에는 어젯밤 기록이 없다.', '문이 닫힌다. 안내 방송이 울린다. “이번 역은 첫 번째 역입니다.”', [{label:'정차 횟수',value:'07'},{label:'출구',value:'초록색 점등'}])
    ],
    escaped: {title:'승차 기록 없음',text:'집에 도착했다. 현관에는 젖은 신발이 한 켤레 더 있다. 적어도 열차에서는 내렸다.'},
    lost: {title:'추가된 승객',text:'다음 야근자의 차창에 당신이 비칠 것이다. 이름을 부르지 않도록 노력하자.'}

    summary:'이 건물은 3층까지다. 엘리베이터에 4층 버튼이 생기기 전까지는.',
    intro:'택배를 전하러 왔을 뿐이다. 문이 닫히자 3층짜리 건물의 버튼이 여섯 개로 늘었다. 비상전화 옆, 오래된 관리원의 메모가 보인다.',
    rules:['네 번째 층이 나타나면 4 → 2 → 6 → 2 → 1 순서로 누르세요.', '누군가 타더라도 눈을 마주치거나 말을 걸지 마세요.', '표시창이 B0이 되면 비상 호출기에 000을 입력하세요.', '문이 열려도 초록색 1F 표시가 켜질 때까지 기다리세요.'],
    rounds:[
      sequence('01: 돌아가는 순서','관리원의 메모대로 층 버튼을 누르세요. 같은 버튼을 여러 번 누를 수 있습니다.', [['1','1층'],['2','2층'],['3','3층'],['4','4층'],['5','5층'],['6','6층']], ['4','2','6','2','1'], '엘리베이터가 위아래로 움직인 뒤 잠잠해졌다. 천장 속 발소리도 멈췄다.', '버튼이 꺼진다. 층마다 다른 당신이 문 앞에서 기다리고 있다.'),
      choice('02: 동승자','등 뒤에서 문이 열린다. “몇 층 가세요?” 어린 목소리가 묻는다. 거울에는 당신 혼자다.', [['talk','1층이라고 대답한다'],['ignore','버튼만 보고 침묵한다'],['mirror','거울을 자세히 본다']], 'ignore','작은 손이 버튼을 누르려다 멈춘다. 목소리는 이번에는 천장 위에서 들린다.','아이가 웃는다. “그 층은 없어졌는데.” 표시창에서 숫자 1이 지워진다.'),

      choice('04: 문 바깥','문이 열렸다. 복도는 밝지만 표시창은 붉은색 1F다. 초록색 불은 아직 꺼져 있다.', [['out','밝은 복도로 나간다'],['wait','초록색 표시를 기다린다']], 'wait','붉은 숫자가 녹아내리고 초록색 1F가 켜졌다. 진짜 관리실의 라디오 소리가 들린다.','복도 끝의 창문으로 당신이 탄 엘리베이터가 보인다. 그 안에도 당신이 있다.')

  },
  {
    id:'night-store',number:'03',title:'새벽 편의점',subtitle:'NIGHT SHIFT',category:'이상 현상',minutes:4,fear:2,location:'모퉁이 편의점 · 02:00',scene:'store',accent:'#5d8379',
    summary:'시급이 높은 데는 이유가 있다. 계산대 아래의 인수인계서를 꼭 읽으세요.',

// Opt-in synthetic ambience: no audio downloads, autoplay or sudden loud cues.
let context, gain, oscillators = [];
async function setSound(enabled) {
  if (!enabled) {
    if (context && context.state === 'running') await context.suspend();
    return true;
  }
  try {
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return false;
    if (!context) {
      context = new Audio();
      gain = context.createGain();
      gain.gain.value = .026;
      gain.connect(context.destination);
      for (const frequency of [55,82.6,110.3]) {
        const oscillator = context.createOscillator();
        oscillator.type = 'sine';
        oscillator.frequency.value = frequency;
        oscillator.connect(gain);
        oscillator.start();
        oscillators.push(oscillator);
      }
    }
    await context.resume();
    return context.state === 'running';
  } catch { return false; }
}
document.addEventListener('visibilitychange',() => {
  if (document.hidden && context?.state === 'running') context.suspend().catch(() => {});
});

function playCue(kind) {
  if(!context || context.state!=='running')return;
  const notes={tap:[175,.09],key:[640,.13],bell:[420,1.1],knock:[82,.16],ring:[560,.4],lost:[37,1.9],door:[66,.8],blink:[48,.7],walk:[95,.5],signal:[190,.3],disconnect:[240,.7],connect:[480,.5]};
  const [frequency,duration]=notes[kind]||[110,.45];
  const voice=context.createOscillator(),envelope=context.createGain(),now=context.currentTime;
  voice.type=kind==='key'||kind==='ring'?'triangle':'sine';
  voice.frequency.setValueAtTime(frequency,now);
  voice.frequency.exponentialRampToValueAtTime(Math.max(24,frequency*(kind==='bell'?.96:.55)),now+duration);
  envelope.gain.setValueAtTime(0,now);
  envelope.gain.linearRampToValueAtTime(kind==='bell'?.038:.024,now+.025);
  envelope.gain.exponentialRampToValueAtTime(.0001,now+duration);
  voice.connect(envelope);envelope.connect(context.destination);
  voice.start(now);voice.stop(now+duration+.03);
  voice.onended=()=>{voice.disconnect();envelope.disconnect();};
}

// Advance only visible, unpaused time. A large frame gap must not skip the scene.
function tickScene(clock,now,paused) {
  const delta=clock.last===null||paused ? 0 : Math.min(Math.max(now-clock.last,0),80);
  return {last:now,elapsed:clock.elapsed+delta};
}

function mountCinema(host,game,{getSession,saveSession,onSound,isSoundOn,nextId}) {
  const abort=new AbortController(),signal=abort.signal;
  const motion=matchMedia('(prefers-reduced-motion: reduce)');
  let frame,disposed=false,paused=false,notebook=false,locked=false,viewAbort=new AbortController();
  let picks=[],picked=null,clock={last:null,elapsed:0},action=null,beat=-1;
  const find=selector=>host.querySelector(selector);
  const listen=(node,event,fn)=>node?.addEventListener(event,fn,{signal:viewAbort.signal});
  const actuallyPaused=()=>paused||notebook||document.hidden;
  const button=(label,content,extra='')=>`<button type="button" aria-label="${label}" ${extra}>${content}</button>`;
  const shortLabel=id=>sceneScripts[game.id][getSession()?.step||0].spots?.find(s=>s.id===id)?.label||id;

  function render(focus=false) {
    viewAbort.abort();viewAbort=new AbortController();
    let session=getSession();
    // Older versions saved an explicit feedback screen. Finish that transition once.
    if(session?.status==='playing'&&session.phase==='feedback'){
      session=advanceRound(session); saveSession(session);
    }
    locked=false;picks=[];picked=null;action=null;beat=-1;clock={last:null,elapsed:0};
    const step=session?.step||0,round=game.rounds[step],script=sceneScripts[game.id][step];
    const intro=!session,ending=session&&session.status!=='playing';
    host.innerHTML=`<section class="cinema scene-${game.scene} ${intro?'is-intro':''} ${ending?`is-ending ending-${session.status}`:''}" aria-label="${game.title}" data-step="${step}">
      <header class="cinema-header"><a href="#" class="cinema-back" aria-label="보관소로 돌아가기">← <span>보관소</span></a><div class="cinema-title"><small>FILE ${game.number}</small><h1>${game.title}</h1></div><div class="cinema-tools">${button('소리 켜기','♪','id="cinema-sound" aria-pressed="false"')}${button('규칙 수첩','☷','id="cinema-notes"')}${button('일시정지','Ⅱ','id="cinema-pause"')}</div></header>
      <div class="scene-viewport"><div class="scene-space"><div class="cinema-world">${sceneArtwork(game.scene,step)}</div><div class="scene-shade"></div><div class="scene-grain"></div><div class="scene-controls">${!intro&&!ending?controls(round,script):''}</div><div class="effect-curtain"></div><div class="effect-lids"></div><div class="effect-fade"></div><div class="scene-crosshair" aria-hidden="true">+</div>
      ${intro?`<div class="cinema-intro"><span class="intro-number">${game.number}</span><p>${game.location}</p><h2>${game.title}</h2><div class="intro-line"></div><button class="enter-scene" id="cinema-enter" type="button">들어가기 <span>→</span></button><small>장면 속 사물을 눌러 행동하세요.</small></div>`:''}
      ${ending?`<div class="cinema-ending" role="status"><span>${session.status==='escaped'?'SIGNAL RESTORED':'SIGNAL LOST'}</span><h2>${game[session.status].title}</h2><div class="ending-actions">${button('다시 도전하기','다시 도전','id="cinema-replay"')}<a href="#game/${nextId}">다음 기록 →</a></div>${session.status==='lost'?button('놓친 규칙 보기','놓친 규칙','id="failure-note" class="failure-note"'):''}</div>`:''}
      </div></div>
      <footer class="cinema-footer"><div class="chapter-dots" role="progressbar" aria-label="장면 진행" aria-valuenow="${ending?100:Math.round(step/game.rounds.length*100)}" aria-valuemin="0" aria-valuemax="100">${game.rounds.map((_,i)=>`<i class="${i<=step?'reached':''}"></i>`).join('')}</div><p id="scene-cue" aria-live="polite">${intro?'규칙은 수첩에 남겨 두었습니다.':ending?'기록이 저장되었습니다.':script.cue}</p><span class="scene-counter">${String(step+1).padStart(2,'0')} / ${String(game.rounds.length).padStart(2,'0')}</span></footer>
      <div class="pause-screen" hidden><p>숨을 고르세요.</p>${button('계속 플레이','계속하기','id="cinema-resume"')}${button('처음부터 다시 시작','처음부터','id="cinema-restart"')}</div>
      <dialog class="scene-notebook" aria-labelledby="notebook-title"><div class="notebook-head"><span>접힌 메모</span>${button('수첩 닫기','×','id="notebook-close"')}</div><h2 id="notebook-title">돌아오는 방법</h2><ol>${game.rules.map(r=>`<li>${r}</li>`).join('')}</ol><details><summary>장면 설명</summary><p>${round.text}</p>${(round.objects||[]).map(o=>`<p><strong>${o.label}</strong> · ${o.detail}</p>`).join('')}</details></dialog>
    </section>`;
    updateSound();syncPause();
    listen(find('#cinema-enter'),'click',()=>{saveSession(createSession(game.id));playCue('door');render(true);});
    listen(find('#cinema-replay'),'click',()=>{saveSession(createSession(game.id));render(true);});
    listen(find('#cinema-pause'),'click',()=>{paused=!paused;syncPause();if(paused)find('#cinema-resume').focus();});
    listen(find('#cinema-resume'),'click',()=>{paused=false;syncPause();find('#cinema-pause').focus();});
    listen(find('#cinema-restart'),'click',()=>{paused=false;saveSession(createSession(game.id));render(true);});
    listen(find('#cinema-notes'),'click',openNotebook);
    listen(find('#failure-note'),'click',openNotebook);
    listen(find('#notebook-close'),'click',()=>find('.scene-notebook').close());
    listen(find('.scene-notebook'),'close',()=>{notebook=false;syncPause();});
    listen(find('#cinema-sound'),'click',async()=>{const b=find('#cinema-sound');b.disabled=true;await onSound();if(!disposed){updateSound();b.disabled=false;}});
    if(!intro&&!ending)bindControls(round,script);
    if(focus){find('.scene-controls button, .enter-scene, #cinema-replay')?.focus({preventScroll:true});}
  }
  function controls(round,script) {
    if(round.type==='code')return `<form class="scene-keypad" id="scene-code-form"><span class="device-label">${script.clue}</span><input id="scene-code" type="text" inputmode="numeric" autocomplete="off" maxlength="${round.answer.length}" aria-label="세 자리 암호" placeholder="— — —"><div class="keypad-grid">${['1','2','3','4','5','6','7','8','9','back','0','enter'].map(n=>button(n==='back'?'한 자리 지우기':n==='enter'?'암호 확인':n,n==='back'?'⌫':n==='enter'?'↵':n,`data-digit="${n}" ${n==='enter'?'disabled':''}`)).join('')}</div></form>`;
    return `${script.clue?`<div class="scene-clue">${script.clue}</div>`:''}${script.spots.map((s,i)=>`<button type="button" class="scene-hotspot ${script.panel?'physical-button':''}" data-action="${s.id}" style="--x:${s.x}%;--y:${s.y}%" aria-label="${s.label}"><span class="hotspot-ring" aria-hidden="true">${script.panel?s.label:'+'}</span><span class="hotspot-label">${script.panel?'':s.label}</span></button>`).join('')}
    ${round.type==='inspect'?`<div class="inspect-commit" hidden><span id="inspected-name"></span>${button(script.commit,`${script.commit} →`,'id="scene-inspect-submit"')}</div>`:''}
    ${round.type==='sequence'?`<div class="scene-sequence"><output aria-label="입력 순서" id="scene-sequence-value">${'○ '.repeat(round.answer.length)}</output>${button('마지막 입력 취소','↶','id="scene-undo" disabled')}${button('순서 실행','→','id="scene-sequence-submit" disabled')}</div>`:''}`;
  }
  function bindControls(round,script) {
    find('.scene-controls').querySelectorAll('[data-action]').forEach(b=>listen(b,'click',()=>{
      if(locked||actuallyPaused())return;
      const id=b.dataset.action;
      if(round.type==='choice'){perform(id,script.spots.find(s=>s.id===id).effect);return;}
      playCue('tap');
      if(round.type==='inspect'){
        picked=id;
        find('.scene-controls').querySelectorAll('[data-action]').forEach(el=>el.setAttribute('aria-pressed',String(el===b)));
        find('.cinema-world').querySelectorAll('[data-object]').forEach(el=>el.classList.toggle('object-selected',el.dataset.object===id));
        find('.inspect-commit').hidden=false;find('#inspected-name').textContent=shortLabel(id);
      }else if(picks.length<round.answer.length){picks.push(id);updateSequence(round);}
    }));
    listen(find('#scene-inspect-submit'),'click',()=>{if(picked)perform(picked,script.effect);});
    listen(find('#scene-undo'),'click',()=>{if(locked||actuallyPaused())return;picks.pop();updateSequence(round);playCue('tap');});
    listen(find('#scene-sequence-submit'),'click',()=>perform([...picks],script.effect));
    if(round.type==='code'){
      const input=find('#scene-code');
      const update=()=>{input.value=input.value.replace(/\D/g,'').slice(0,round.answer.length);find('[data-digit="enter"]').disabled=input.value.length!==round.answer.length;};
      listen(input,'input',update);
      find('.keypad-grid').querySelectorAll('button').forEach(b=>listen(b,'click',()=>{
        if(locked||actuallyPaused())return;
        if(b.dataset.digit==='enter'){perform(input.value,script.effect);return;}
        input.value=b.dataset.digit==='back'?input.value.slice(0,-1):(input.value+b.dataset.digit).slice(0,round.answer.length);update();playCue('key');
      }));
      listen(find('#scene-code-form'),'submit',e=>{e.preventDefault();if(input.value.length===round.answer.length)perform(input.value,script.effect);});
    }
  }
  function updateSequence(round){
    find('#scene-sequence-value').textContent=picks.map(shortLabel).join(' · ')+(picks.length<round.answer.length?` ${'○ '.repeat(round.answer.length-picks.length)}`:'');
    find('#scene-undo').disabled=!picks.length;
    find('#scene-sequence-submit').disabled=picks.length!==round.answer.length;
    find('.scene-controls').querySelectorAll('[data-action]').forEach(b=>b.setAttribute('aria-pressed',String(picks.includes(b.dataset.action))));
    if(game.scene==='classroom'||game.scene==='laundry'||game.scene==='store')find('.cinema-world').querySelectorAll('[data-object]').forEach(el=>el.classList.toggle('object-used',picks.includes(el.dataset.object)));
  }
  function perform(answer,effect='wait'){
    if(locked||actuallyPaused())return;
    const before=getSession(),after=answerRound(before,answer);
    if(after===before)return;
    locked=true;saveSession(after);
    const failed=after.status==='lost';
    action={start:clock.elapsed,duration:motion.matches?600:failed?2300:effect==='wait'?2700:2100,after};
    find('.cinema').dataset.effect=failed?'lost':effect;
    find('.cinema').classList.add('is-acting');
    find('.scene-controls').inert=true;
    find('#scene-cue').textContent='';
    playCue(failed?'lost':effect);
  }
  function openNotebook(){notebook=true;syncPause();find('.scene-notebook').showModal();}
  function updateSound(){const b=find('#cinema-sound');if(!b)return;b.textContent=isSoundOn()?'♫':'♪';b.setAttribute('aria-label',isSoundOn()?'소리 끄기':'소리 켜기');b.setAttribute('aria-pressed',String(isSoundOn()));}
  function syncPause(){
    const root=find('.cinema');if(!root)return;
    root.classList.toggle('is-paused',actuallyPaused());root.classList.toggle('reduce-motion',motion.matches);
    find('.pause-screen').hidden=!paused;find('#cinema-pause').setAttribute('aria-pressed',String(paused));
    find('.scene-controls').inert=locked||actuallyPaused();
  }
  function animate(now){
    if(disposed)return;
    clock=tickScene(clock,now,actuallyPaused());
    if(action&&!actuallyPaused()){
      const progress=Math.min(1,(clock.elapsed-action.start)/action.duration);
      find('.cinema').style.setProperty('--action-progress',progress.toFixed(3));
      find('.cinema').style.setProperty('--veil',Math.sin(progress*Math.PI).toFixed(3));
      find('.cinema').style.setProperty('--fade',Math.max(0,(progress-.65)/.35).toFixed(3));
      if(progress>=1){if(action.after.status==='playing')saveSession(advanceRound(action.after));render(true);}
    }
    const session=getSession();
    if(!locked&&!actuallyPaused()&&session?.status==='playing'){
      const b=Math.floor(clock.elapsed/900);
      if(b!==beat){beat=b;const cycle=b%9;
        if((game.scene==='classroom'&&session.step===1&&cycle<4)||(game.scene==='hotel'&&session.step===0&&cycle<3)||(game.scene==='laundry'&&session.step===1&&cycle<3))playCue(game.scene==='classroom'?'bell':'knock');
        if(game.scene==='phone'&&session.step===0&&cycle<3)playCue('ring');
      }
    }
    frame=requestAnimationFrame(animate);
  }
  document.addEventListener('visibilitychange',()=>{syncPause();updateSound();},{signal});
  motion.addEventListener('change',syncPause,{signal});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!notebook){e.preventDefault();paused=!paused;syncPause();if(paused)find('#cinema-resume').focus();}},{signal});
  render();frame=requestAnimationFrame(animate);
  return ()=>{disposed=true;cancelAnimationFrame(frame);abort.abort();viewAbort.abort();host.replaceChildren();};
}

function save() {
  if (writable) {
    try { localStorage.setItem(STORAGE_KEY,JSON.stringify(library)); }
    catch { writable=false; warning='브라우저 저장 공간을 사용할 수 없어 이후 기록은 이번 방문 동안만 유지돼요.'; showWarning(); }
  }
  $('#collection-count').textContent=pad(endingCount(library));
}
function showWarning() { $('#storage-warning').hidden=!warning; $('#storage-warning').textContent=warning; }
function activeGame() { return gameById(location.hash.slice(6)); }
function navigate(id) { location.hash=id ? `game/${id}` : ''; }
function saveSession(session) { recordSession(library,session); save(); }
function bookmarkButton(game) {
  const saved=library.favorites.includes(game.id);
  return `<button class="bookmark-button ${saved?'saved':''}" data-bookmark="${game.id}" type="button" aria-label="${game.title} ${saved?'보관 해제':'보관하기'}" aria-pressed="${saved}">${icon('bookmark')}</button>`;
}
function renderCard(game) {
  const endings=library.endings[game.id] || [];
  const playing=library.sessions[game.id]?.status==='playing';
  return `<article class="game-card" style="--accent:${game.accent}"><div class="card-picture"><a href="#game/${game.id}" class="art-link" tabindex="-1" aria-hidden="true">${sceneArt(game.scene,{seed:Number(game.number)})}</a><span class="file-number">FILE_${game.number}</span>${bookmarkButton(game)}<span class="card-status ${endings.includes('escaped')?'is-clear':''}">${endings.includes('escaped')?'귀환 확인':playing?'기록 진행 중':`미확인 기록`}</span><span class="picture-arrow">${icon('arrow')}</span></div><div class="card-body"><div class="card-meta"><span>${game.category}</span><span>${icon('clock')}${game.minutes}분</span></div><h3><a href="#game/${game.id}">${game.title}</a></h3><div class="card-bottom"><span class="fear" aria-label="공포도 ${game.fear}, 3단계 중"><span class="fear-label">공포도</span>${[1,2,3].map(n=>`<i class="${n<=game.fear?'filled':''}"></i>`).join('')}</span><span class="play-link">${playing?'이어서 플레이':'들어가기'} ${icon('arrow')}</span></div></div></article>`;
}
function renderHome() {
  main.innerHTML=`<div class="home-wrap"><section class="hero" aria-labelledby="hero-title"><div class="hero-copy"><div class="eyebrow"><span class="red-dot"></span> 일상에 숨어든 열 가지 괴담</div><h1 id="hero-title">돌아오려면,<br><em>규칙을 기억하세요.</em></h1><p>움직임을 살피고, 직접 행동하세요.</p><div class="hero-actions"><a class="button primary" href="#game/last-train">막차에 오르기 ${icon('arrow')}</a><span class="hero-note">${icon('clock')} 잠깐이면 충분해요.</span></div><div class="hero-stats"><div><strong>10</strong><span>개의 기록</span></div><span class="stat-divider"></span><div><strong>2–4</strong><span>분의 악몽</span></div><span class="stat-divider"></span><div><strong>20</strong><span>개의 결말</span></div></div></div><div class="hero-visual">${sceneArt('train',{seed:7})}<div class="hero-image-top"><span><i class="red-dot"></i> REC</span><span>CAM 01 / 00:13:06</span></div><div class="crosshair top-left"></div><div class="crosshair bottom-right"></div><div class="hero-annotation"><span>01</span><div><small>첫 번째 기록</small><strong>마지막 승객</strong></div><a href="#game/last-train" aria-label="마지막 승객 플레이">${icon('arrow')}</a></div><span class="image-side-note">DO NOT LOOK BEHIND YOU.</span></div></section>
  <aside class="notice"><span class="notice-label">${icon('file')} 열람 전 안내</span><p>장면 속 사물을 눌러 행동하세요. <span>규칙이 기억나지 않으면 수첩을 펼치세요.</span></p><button id="notice-about" type="button" aria-label="열람 안내 자세히 보기">${icon('arrow')}</button></aside>
  <section class="archive" id="archive" aria-labelledby="archive-heading"><div class="section-heading"><div><span class="eyebrow">THE ARCHIVE</span><h2 id="archive-heading">기록 보관소 <span>10</span></h2></div><button class="random-button" id="random-game" type="button">${icon('shuffle')} 운명에 맡기기</button></div>
  <div class="archive-toolbar"><div class="filter-tabs" role="group" aria-label="게임 분류">${[['all','전체 기록'],['규칙 생존','규칙 생존'],['이상 현상','이상 현상'],['심리 공포','심리 공포']].map(([value,label])=>`<button type="button" data-filter="${value}" aria-pressed="${filters.category===value}" class="${filters.category===value?'selected':''}">${label}${value==='all'?'<span>10</span>':''}</button>`).join('')}</div><div class="catalog-tools"><label class="search-box">${icon('search')}<input id="search-input" type="search" placeholder="기록 검색" aria-label="게임 검색" autocomplete="off"></label><label class="sort-label"><span class="sr-only">게임 정렬</span><select id="sort-select"><option value="archive">기록 번호순</option><option value="short">짧은 게임순</option><option value="fear">공포도 높은순</option></select></label></div></div>
  <div class="filter-summary"><p id="result-count" aria-live="polite"></p><label class="saved-filter"><input id="favorites-filter" type="checkbox" ${filters.favoritesOnly?'checked':''}> 보관한 기록만</label></div><div id="game-grid" class="game-grid"></div></section>
  <section class="archive-bottom"><span class="seal-outline" aria-hidden="true">禁</span><div><h2>모든 기록에는 끝이 있습니다.</h2><p>당신이 돌아오는 결말이기를 바랍니다.</p></div><span class="bottom-label">END OF ARCHIVE<br>다음 기록을 기다리며.</span></section></div>`;
  $('#search-input').value=filters.query;
  $('#sort-select').value=filters.sort;
  $('#search-input').addEventListener('input',event=>{filters.query=event.target.value; renderGrid();});
  $('#sort-select').addEventListener('change',event=>{filters.sort=event.target.value; renderGrid();});
  $('#favorites-filter').addEventListener('change',event=>{filters.favoritesOnly=event.target.checked; renderGrid();});
  $('[data-filter]')?.parentElement.addEventListener('click',event=>{const button=event.target.closest('[data-filter]'); if(!button)return; filters.category=button.dataset.filter; document.querySelectorAll('[data-filter]').forEach(item=>{item.classList.toggle('selected',item===button);item.setAttribute('aria-pressed',String(item===button));});renderGrid();});
  $('#random-game').addEventListener('click',()=>navigate(games[Math.floor(Math.random()*games.length)].id));
  $('#notice-about').addEventListener('click',showAbout);
  renderGrid();
}
function renderGrid() {
  const selected=selectGames(filters,library);
  $('#result-count').textContent=`${pad(selected.length)}개의 기록을 찾았습니다`;
  $('#game-grid').innerHTML=selected.length ? selected.map(renderCard).join('') : '<div class="empty-state"><span>∅</span><h3>아직 발견되지 않은 기록입니다.</h3><p>다른 단어로 검색하거나 보관 필터를 해제해 보세요.</p><button type="button" class="button secondary" id="reset-filters">전체 기록 보기</button></div>';
  $('#reset-filters')?.addEventListener('click',()=>{Object.assign(filters,{category:'all',query:'',favoritesOnly:false});renderHome();$('#archive-heading').scrollIntoView({block:'start'});});
}
function renderGame(game) {
  destroyCinema=mountCinema(main,game,{
    getSession:()=>library.sessions[game.id],saveSession,
    onSound:toggleSound,isSoundOn:()=>soundEnabled,
    nextId:games[(games.indexOf(game)+1)%games.length].id
  });
}
function openDialog(content) { $('#dialog-content').innerHTML=content; if(!dialog.open)dialog.showModal(); }
function showAbout() {
  openDialog(`<h2 id="dialog-title">열람 전 안내</h2><p>금기록은 익숙한 장소의 이상한 규칙을 따라 살아 돌아오는 짧은 나폴리탄 공포게임 모음입니다. 모든 이야기와 장면은 이 프로젝트를 위해 만들었습니다.</p><ul class="about-list"><li><strong>짧은 열 가지 이야기</strong><span>움직이는 장면 속 사물을 눌러 진행합니다. 시간 제한은 없습니다.</span></li><li><strong>규칙을 기억하세요</strong><span>손잡이·문·전화기·모니터를 직접 조작하세요. 상단 수첩을 열면 세계가 멈추고 규칙을 확인할 수 있습니다.</span></li><li><strong>두 가지 결말</strong><span>각 게임에 귀환과 실종 엔딩이 있습니다. 보관한 기록과 엔딩은 이 브라우저에 저장합니다. 브라우저 데이터를 지우면 기록도 사라집니다.</span></li><li><strong>원하는 만큼의 분위기</strong><span>소리 버튼으로 환경음과 행동음을 켭니다. 일시정지 버튼이나 Esc로 멈출 수 있습니다. 기기의 움직임 줄이기 설정을 따릅니다.</span></li></ul><p class="small-copy">실제 장소·인물과 관련 없는 허구입니다. 기기나 브라우저 간 기록은 자동으로 공유되지 않습니다.</p>`);
}
function showCollection() {
  openDialog(`<h2 id="dialog-title">당신이 남긴 기록</h2><div class="collection-stats"><div><strong>${pad(escapeCount(library))}<small>/ 10</small></strong><span>귀환한 이야기</span></div><div><strong>${pad(endingCount(library))}<small>/ 20</small></strong><span>발견한 결말</span></div></div><div class="collection-list">${games.map(game=>`<a href="#game/${game.id}" class="collection-item"><span class="collection-number">${game.number}</span><span>${game.title}<small>${library.sessions[game.id]?.status==='playing'?'진행 중 · 이어서 플레이':'기록 열기'}</small></span><div><span class="ending-dot ${(library.endings[game.id]||[]).includes('escaped')?'found-good':''}" aria-label="귀환 엔딩 ${(library.endings[game.id]||[]).includes('escaped')?'발견':'미발견'}">귀환</span><span class="ending-dot ${(library.endings[game.id]||[]).includes('lost')?'found-lost':''}" aria-label="실종 엔딩 ${(library.endings[game.id]||[]).includes('lost')?'발견':'미발견'}">실종</span></div></a>`).join('')}</div>`);
  document.querySelectorAll('.collection-item').forEach(link=>link.addEventListener('click',()=>dialog.close()));
}
document.addEventListener('click',event=>{
  const button=event.target.closest('[data-bookmark]');
  if(!button)return;
  const id=button.dataset.bookmark;
  const wasSaved=library.favorites.includes(id);
  library.favorites=wasSaved?library.favorites.filter(value=>value!==id):[...library.favorites,id];
  save();
  button.classList.toggle('saved',!wasSaved);
  button.setAttribute('aria-pressed',String(!wasSaved));
  button.setAttribute('aria-label',`${gameById(id).title} ${wasSaved?'보관하기':'보관 해제'}`);
  if(!activeGame() && filters.favoritesOnly)renderGrid();
  notify(wasSaved?'보관을 해제했습니다.':'기록을 보관했습니다.');
});
$('#about-button').addEventListener('click',showAbout);
$('.skip-link').addEventListener('click',event=>{event.preventDefault();main.focus();main.scrollIntoView({block:'start'});});
$('#collection-button').addEventListener('click',showCollection);
$('#close-dialog').addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',event=>{if(event.target===dialog){const rect=dialog.getBoundingClientRect();if(event.clientX<rect.left || event.clientX>rect.right || event.clientY<rect.top || event.clientY>rect.bottom)dialog.close();}});
async function toggleSound() {
  const requested=!soundEnabled;
  $('#sound-button').disabled=true;
  const success=await setSound(requested);
  soundEnabled=requested && success;
  library.sound=soundEnabled; save(); updateSound();
  if(requested&&!success)notify('이 브라우저에서는 환경음을 재생할 수 없어요. 게임은 그대로 즐길 수 있습니다.');
  $('#sound-button').disabled=false;
}
function updateSound() {$('#sound-button').innerHTML=`${icon(soundEnabled?'volume':'muted')}<span>소리 ${soundEnabled?'켜짐':'꺼짐'}</span>`;$('#sound-button').setAttribute('aria-label',`환경음 ${soundEnabled?'끄기':'켜기'}`);$('#sound-button').setAttribute('aria-pressed',String(soundEnabled));}
$('#sound-button').addEventListener('click',toggleSound);
document.addEventListener('visibilitychange',()=>{if(document.hidden){soundEnabled=false;library.sound=false;updateSound();}});
function route() {
  destroyCinema?.();destroyCinema=null;
  if(dialog.open)dialog.close();
  const game=location.hash.startsWith('#game/')?activeGame():null;
  document.title=game?`${game.title} — 금기록`:'금기록 — 돌아오려면, 규칙을 기억하세요.';
  document.body.classList.toggle('playing',Boolean(game));
  if(game)renderGame(game);else renderHome();
  $('#archive-link').classList.toggle('active',!game);
  window.scrollTo(0,0);
  main.focus({preventScroll:true});
  if(location.hash.startsWith('#game/')&&!game)notify('찾을 수 없는 기록이에요. 보관소로 돌아왔습니다.');
}
window.addEventListener('hashchange',route);
showWarning(); updateSound(); save(); route();
</script>
</body>
</html>
